apiVersion: apps/v1
kind: Deployment
metadata:
  name: solontax-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solontax-postgres
  template:
    metadata:
      labels:
        app: solontax-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:13.22-alpine3.21
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres"
            - name: POSTGRES_DB
              value: "solontax_g1"
          args: ["-p","5430","-c","timezone=UTC"]
          ports:
            - containerPort: 5430
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: solontax-postgres
spec:
  selector:
    app: solontax-postgres
  type: NodePort
  ports:
    - protocol: TCP
      port: 5430
      targetPort: 5430
      nodePort: 30430

