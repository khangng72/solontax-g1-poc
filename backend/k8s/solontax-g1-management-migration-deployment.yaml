apiVersion: apps/v1
kind: Deployment
metadata:
  name: solontax-g1-management-migration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solontax-g1-management-migration
  template:
    metadata:
      labels:
        app: solontax-g1-management-migration
    spec:
      containers:
        - name: solontax-g1-management-migration
          image: solontax-g1-management-migration:0.0.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1930
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://solontax-postgres:5430/solontax_g1"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SPRING_SERVER_PORT
              value: "1930"
            - name: SPRING_JPA_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker-service:9092"
            - name: KAFKA_ENDPOINT_DOMAIN
              value: "http://solontax-g1-management-service:1975"

---
apiVersion: v1
kind: Service
metadata:
  name: solontax-g1-management-migration-service
spec:
  type: NodePort
  selector:
    app: solontax-g1-management-migration
  ports:
    - protocol: TCP
      port: 1930
      targetPort: 1930
      nodePort: 30030
