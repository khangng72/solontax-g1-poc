apiVersion: apps/v1
kind: Deployment
metadata:
  name: solontax-g1-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app: solontax-g1-management
  template:
    metadata:
      labels:
        app: solontax-g1-management
    spec:
      containers:
        - name: solontax-g1-management
          image: solontax-g1-management:0.0.1
          ports:
            - containerPort: 1975
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://solontax-postgres:5430/solontax_g1"
            - name: SPRING_DATASOURCE_USERNAME
              value: "postgres"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "postgres"
            - name: SPRING_SERVER_PORT
              value: "1975"
            - name: SPRING_JPA_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "true"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-broker-service:9092"

---
apiVersion: v1
kind: Service
metadata:
  name: solontax-g1-management-service
spec:
  type: NodePort
  selector:
    app: solontax-g1-management
  ports:
    - protocol: TCP
      port: 1975
      targetPort: 1975
      nodePort: 30075
