name: solontax-g1

services:
  postgres:
    image: postgres:13.22-alpine3.21
    container_name: solontax-g1-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solontax_g1
    command: [ "postgres", "-p", "5430","-c", "timezone=UTC" ]
    ports:
      - "5430:5430"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solontax-network

  kafka:
    image: apache/kafka:latest
    container_name: solontax-g1-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://solontax-g1-kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@solontax-g1-kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - solontax-network

  solontax-g1-management:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solontax-g1-management
    image: solontax-g1-management
    restart: always
    ports:
      - "1975:1975"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5430/solontax_g1
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_SERVER_PORT: 1975
      SPRING_JPA_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: solontax-g1-kafka:9092
    depends_on:
      - postgres
      - kafka
    networks:
      - solontax-network

volumes:
  postgres_data:
    driver: local
  kafka_data:
    driver: local

networks:
  solontax-network:
    driver: bridge
